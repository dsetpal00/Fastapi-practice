name: FASTAPI CI Pipeline

#when will the workflow trigger/ when should the pipeline run
on: 
  push:
#all the branches jisper workflow run on pushing code...
    # branches: ["main"] or
    branches:
      - "main"
      - "another_branch"

  pull_request:
    branches:
      - "main"

#what work should github perform?
jobs:
  test:
  #Github provides a virtual machine
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432

    env:
      database_hostname: localhost
      database_port: 5432
      database_username: test_user
      database_password: test_password
      database_name: test_db
      secret_key: test_secret_key_for_ci_only


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r task-manager-api/requirements.txt

      - name: Run tests
        working-directory: task-manager-api
        run: pytest tests/ -v
